<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Md. Samiul Haque — Frontend Software Engineer</title>
    <meta
      name="description"
      content="Md. Samiul Haque is a frontend software engineer at AppsCode building VueJS and Nuxt web applications, including the console teams use to manage Kubernetes clusters."
    >
    <meta property="og:type" content="website">
    <meta property="og:title" content="Md. Samiul Haque — Frontend Software Engineer">
    <meta
      property="og:description"
      content="Frontend engineer with 3+ years at AppsCode building VueJS and Nuxt applications. Competitive programmer (Codeforces max 1577)."
    >
    <meta name="theme-color" content="#f8f6f0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#131418" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap"
    >

    <!-- Apply a saved theme before first paint to avoid a light/dark flash. -->
    <script>
      try {
        var theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
